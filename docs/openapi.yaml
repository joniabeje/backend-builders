openapi: 3.1.0
info:
  title: CEA Event Space Reservation API
  version: 0.1.0
  description: |
    HTTP API for rooms and reservations (#55–#57). Implemented as TanStack Start
    server routes under `/api`. The browser never talks to Firestore; only these
    endpoints (and the Admin SDK on the server) do.

    **Auth.** `POST /api/auth/sign-in` sets the HttpOnly `cea_session` cookie.
    `PATCH /api/reservations/{id}` requires an **admin** session: **401** when
    signed out, **403** when the role is not admin (#62). Other routes are still
    open until later tickets tighten them.

    **Local use.** Start the Firestore emulator, run `npm run seed`, then
    `npm run dev`. Point clients at the same origin (for example
    `http://127.0.0.1:8080`).
servers:
  - url: /
    description: Same origin as the TanStack Start app
tags:
  - name: rooms
  - name: reservations
  - name: auth

paths:
  /api/auth/sign-in:
    post:
      tags: [auth]
      summary: Sign in with email and password
      description: |
        Creates a session document and sets the HttpOnly `cea_session` cookie.
        Demo accounts are seeded by `npm run seed` (#60).
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Signed in. `Set-Cookie` carries `cea_session`.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/sign-out:
    post:
      tags: [auth]
      summary: Sign out
      description: Deletes the session (if any) and clears the `cea_session` cookie.
      operationId: signOut
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/me:
    get:
      tags: [auth]
      summary: Current signed-in user
      operationId: currentUser
      responses:
        "200":
          description: The user for the `cea_session` cookie.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/rooms:
    get:
      tags: [rooms]
      summary: List rooms
      description: |
        Returns every room document in Firestore (seeded from the CEA catalog).
        Image assets stay in the client bundle and are not part of this response.
      operationId: listRooms
      responses:
        "200":
          description: Rooms, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/reservations:
    get:
      tags: [reservations]
      summary: List reservations
      description: |
        All reservations, newest `submittedAt` first, each with history and risk.
        Pass `requester=me` to return only the signed-in user's rows (**401** when
        signed out). Used by `/dashboard` (#36).
      operationId: listReservations
      parameters:
        - name: requester
          in: query
          required: false
          description: Set to `me` to scope the list to the current session user.
          schema:
            type: string
            enum: [me]
      responses:
        "200":
          description: Reservation list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [reservations]
      summary: Create a reservation
      description: |
        Accepts only `NewReservation` fields. The server assigns `id`, `requester`,
        `status` (`pending`), `submittedAt`, empty `history`, and computes `risk`.
        When a session cookie is present, `requester` / `requesterId` come from that
        user so `requester=me` can find the row (#36). Client-supplied `id`, `status`,
        `risk`, or `requester` are ignored.

        Runs `validateReservation` then `findConflicts`. Field errors → `400`.
        Double booking → `409`.
      operationId: createReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReservation"
      responses:
        "201":
          description: Created reservation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/reservations/{id}:
    parameters:
      - $ref: "#/components/parameters/ReservationId"
    get:
      tags: [reservations]
      summary: Get one reservation
      operationId: getReservation
      responses:
        "200":
          description: The reservation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [reservations]
      summary: Review a reservation
      description: |
        Applies an admin decision (`approved`, `needs-changes`, or `rejected`),
        updates `status`, and appends one history entry. The history `actor` is
        the signed-in admin's name. Reject / request-changes need at least 10
        characters of feedback.

        Requires the `cea_session` cookie for an **admin** account (#62).
      operationId: reviewReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "200":
          description: Updated reservation, including the new history entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    ReservationId:
      name: id
      in: path
      required: true
      description: Reservation id, for example `REQ-1043`.
      schema:
        type: string
        pattern: "^REQ-[0-9]+$"

  schemas:
    Role:
      type: string
      enum: [student, advisor, admin, facilities]

    PublicUser:
      type: object
      additionalProperties: false
      required: [id, email, name, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    RequestStatus:
      type: string
      enum: [pending, approved, needs-changes, rejected]

    ReviewDecision:
      type: string
      enum: [approved, needs-changes, rejected]

    RiskLevel:
      type: string
      enum: [low, medium, high]

    RiskFactorCode:
      type: string
      enum:
        - large-attendance
        - elevated-attendance
        - external-guests
        - after-hours
        - food-service
        - security-staffing
        - invalid-input

    RiskFactor:
      type: object
      additionalProperties: false
      required: [code, points, reason]
      properties:
        code:
          $ref: "#/components/schemas/RiskFactorCode"
        points:
          type: integer
        reason:
          type: string

    RiskAssessment:
      type: object
      additionalProperties: false
      required: [level, score, factors, requiresReview, reviewReason]
      properties:
        level:
          $ref: "#/components/schemas/RiskLevel"
        score:
          type: integer
          minimum: 0
        factors:
          type: array
          items:
            $ref: "#/components/schemas/RiskFactor"
        requiresReview:
          type: boolean
        reviewReason:
          type: [string, "null"]

    StatusChange:
      type: object
      additionalProperties: false
      required: [from, to, actor, at]
      properties:
        from:
          $ref: "#/components/schemas/RequestStatus"
        to:
          $ref: "#/components/schemas/RequestStatus"
        actor:
          type: string
        feedback:
          type: string
        at:
          type: string
          format: date-time
          description: ISO-8601 timestamp.

    Room:
      type: object
      additionalProperties: false
      required: [id, name, building, floor, capacity, features]
      properties:
        id:
          type: string
          description: Stable room id, for example `seminar-201`.
        name:
          type: string
        building:
          type: string
        floor:
          type: string
        capacity:
          type: integer
          minimum: 1
        features:
          type: array
          items:
            type: string

    NewReservation:
      type: object
      additionalProperties: true
      description: |
        Fields the client may send on create. Extra properties such as `id`,
        `status`, `risk`, and `requester` are ignored by the server.
      required:
        - title
        - organization
        - advisor
        - advisorEmail
        - advisorApproved
        - purpose
        - date
        - startTime
        - endTime
        - attendance
        - room
        - hasFood
        - externalGuests
        - itNeeds
      properties:
        title:
          type: string
        organization:
          type: string
        advisor:
          type: string
        advisorEmail:
          type: string
          format: email
        advisorApproved:
          type: boolean
        purpose:
          type: string
        date:
          type: string
          format: date
          description: YYYY-MM-DD
        startTime:
          type: string
          description: HH:mm (24h)
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          description: HH:mm (24h)
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        attendance:
          type: integer
        room:
          type: string
          description: A `Room.id`.
        hasFood:
          type: boolean
        externalGuests:
          type: boolean
        itNeeds:
          type: boolean

    Reservation:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - organization
        - requester
        - advisor
        - advisorEmail
        - advisorApproved
        - purpose
        - date
        - startTime
        - endTime
        - attendance
        - room
        - status
        - hasFood
        - externalGuests
        - itNeeds
        - submittedAt
        - history
        - risk
      properties:
        id:
          type: string
          example: REQ-1043
        title:
          type: string
        organization:
          type: string
        requester:
          type: string
          description: Placeholder until accounts exist (#14).
        advisor:
          type: string
        advisorEmail:
          type: string
        advisorApproved:
          type: boolean
        purpose:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        attendance:
          type: integer
        room:
          type: string
        status:
          $ref: "#/components/schemas/RequestStatus"
        hasFood:
          type: boolean
        externalGuests:
          type: boolean
        itNeeds:
          type: boolean
        submittedAt:
          type: string
          description: YYYY-MM-DD when the server accepted the request.
        history:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/StatusChange"
        risk:
          $ref: "#/components/schemas/RiskAssessment"

    ReviewInput:
      type: object
      additionalProperties: false
      required: [decision, feedback]
      properties:
        decision:
          $ref: "#/components/schemas/ReviewDecision"
        feedback:
          type: string
          description: |
            Required (≥ 10 characters after trim) for `needs-changes` and
            `rejected`. Optional for `approved`.

    ValidationIssue:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [error, warn]
        message:
          type: string

    BookedSlot:
      type: object
      additionalProperties: false
      required: [id, room, date, startTime, endTime, status]
      properties:
        id:
          type: string
        room:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        status:
          $ref: "#/components/schemas/RequestStatus"

    ErrorMessage:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    ValidationError:
      allOf:
        - $ref: "#/components/schemas/ErrorMessage"
        - type: object
          properties:
            issues:
              type: array
              items:
                $ref: "#/components/schemas/ValidationIssue"

    ConflictError:
      allOf:
        - $ref: "#/components/schemas/ErrorMessage"
        - type: object
          required: [conflicts]
          properties:
            conflicts:
              type: array
              items:
                $ref: "#/components/schemas/BookedSlot"

  responses:
    BadRequest:
      description: |
        Malformed JSON, wrong field types, validation errors on create, or
        missing review feedback on patch.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationError"
              - $ref: "#/components/schemas/ErrorMessage"
    Unauthorized:
      description: Missing, invalid, or expired session, or bad sign-in credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Forbidden:
      description: Signed in, but the role is not allowed (non-admin on PATCH).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    NotFound:
      description: No reservation with that id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Conflict:
      description: The room is already held for an overlapping time.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictError"
    InternalError:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
